<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2f5d46; --brand-ink:#fff; --brand-soft:#e8efe9;
  --accent:#4f9c88; --side:#1d2b24;
  --bg:#fcf8f9; --card:#ffffff; --ink:#2a1f2d; --muted:#7d7080; --line:#eddfe3;
  --radius:16px; --cols:4; --ratio:1/1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17111a;--card:#221a26;--ink:#f3ecf4;--muted:#a99cad;--line:#352a3b;--brand-soft:#3a2230;}
}
:root[data-bg="cream"]{--bg:#fbf8f0;--line:#e6e0cf}
:root[data-bg="white"]{--bg:#ffffff}
:root[data-theme="dark"]{--bg:#17111a;--card:#221a26;--ink:#f3ecf4;--muted:#a99cad;--line:#352a3b;--brand-soft:#3a2230;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.65}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.main{display:flex;flex-direction:column}

.ann{background:var(--side);color:#f1e6f1;text-align:center;font-size:13px;padding:7px 12px}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;text-decoration:none;color:inherit}
.logo i{font-style:normal;width:34px;height:34px;border-radius:calc(var(--radius) * .7);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.logo img{height:36px;max-width:150px;object-fit:contain}
.sp{flex:1}
.hnav{display:flex;gap:18px}
.hnav a{color:var(--muted);text-decoration:none;font-weight:500}
.hnav a:hover{color:var(--ink)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;color:var(--ink)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lang{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-weight:600;color:var(--ink)}
.cnt{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--brand);color:var(--brand-ink);border-radius:99px;min-width:19px;line-height:19px;font-size:11px;text-align:center;font-weight:700}

/* sections */
.blk{margin-bottom:30px;padding-block:var(--sp,0px)}
.blk[data-pad="sm"]{--sp:14px}.blk[data-pad="md"]{--sp:26px}.blk[data-pad="lg"]{--sp:46px}
.blk[data-bg="soft"],.blk[data-bg="brand"],.blk[data-bg="dark"]{padding-inline:22px;border-radius:calc(var(--radius) * 1.6)}
.blk[data-bg="soft"]{background:var(--brand-soft)}
.blk[data-bg="brand"]{background:var(--brand);color:var(--brand-ink);--muted:color-mix(in srgb,var(--brand-ink) 78%,transparent)}
.blk[data-bg="dark"]{background:#1d2b24;color:#f3ecf4;--muted:#c5d2c9}
.blk[data-bg="brand"] .btn{background:var(--brand-ink);color:var(--brand)}
.blk[data-bg="dark"] .btn{background:var(--brand);color:var(--brand-ink)}
.blk[data-align="center"]{text-align:center}
.blk[data-align="center"] .hero p{margin-inline:auto}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
.hero[data-layout="center"]{grid-template-columns:1fr;text-align:center}
.hero[data-layout="center"] p{margin-inline:auto}
.hero h1{font-size:40px;line-height:1.25;margin:0 0 12px}
.hero p{color:var(--muted);font-size:17px;margin:0 0 20px;max-width:460px}
.btn{border:0;border-radius:calc(var(--radius) * .85);padding:12px 22px;font-weight:700;background:var(--brand);color:var(--brand-ink);display:inline-block;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;text-align:center}
.heroart{position:relative;height:300px;border-radius:calc(var(--radius) * 1.7);background:linear-gradient(150deg,var(--brand-soft),color-mix(in srgb,var(--brand) 22%,var(--bg)));overflow:hidden}
.heroart span{position:absolute;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:0 10px 30px rgba(30,60,45,.18)}
.heroart .a{width:150px;height:150px;font-size:72px;inset-inline-start:14%;top:16%}
.heroart .b{width:100px;height:100px;font-size:48px;inset-inline-end:10%;top:10%}
.heroart .c{width:110px;height:110px;font-size:52px;inset-inline-end:22%;bottom:8%}
.heroimg{width:100%;height:300px;object-fit:cover;border-radius:calc(var(--radius) * 1.7);display:block}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.trust div{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--radius) * .9);padding:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;text-align:start}
.trust b{display:block;font-size:14px}
.trust em{font-style:normal;font-size:22px}
h2.t{font-size:23px;margin:0 0 14px}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 18px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.skin{display:flex;gap:8px;align-items:center;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}
.skin small{color:var(--muted);flex:none}
.chip.s{padding:3px 13px;font-size:13.5px}
.pg{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:14px}
.pc{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;text-align:start;padding:0}
.pc .im{aspect-ratio:var(--ratio);display:grid;place-items:center;font-size:64px;position:relative}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;border-radius:8px;padding:1px 9px}
.tag.low{background:#c9822b}
.pc .bd{padding:12px 13px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.pc .nm{font-weight:600;line-height:1.4}
.pc .ty{color:var(--muted);font-size:13px}
.price{display:flex;gap:8px;align-items:baseline;margin-top:auto;padding-top:6px}
.price b{font-size:17px}
.price s{color:var(--muted);font-size:13px}
.stars{color:#d8a02e;font-size:13px;letter-spacing:1px}
.no-rating .stars{display:none}
.no-old .price s{display:none}
.no-badges .tag{display:none}
.no-badges .best-tag{display:block}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rv{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:start}
.rv p{margin:6px 0 8px}
.rv small{color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.how h3{margin:0 0 4px;font-size:17px}
.how p{margin:0;color:var(--muted)}
/* best sellers */
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bh h2{margin:0}
.arrows{display:flex;gap:8px}
.arr{border-radius:50%;width:38px;height:38px}
.arr.prev svg{transform:scaleX(-1)}
[dir=rtl] .arr.prev svg{transform:none}
[dir=rtl] .arr.next svg{transform:scaleX(-1)}
.btrack{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 6px}
.btrack::-webkit-scrollbar{display:none}
.btrack .pc{flex:0 0 220px;scroll-snap-align:start}
.rank{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sold{font-size:12.5px;color:var(--accent);font-weight:600}
/* custom banner */
.cb{display:grid;gap:18px;align-items:center}
.cb.has-img{grid-template-columns:1fr 1fr}
.cbimg{width:100%;max-height:280px;object-fit:cover;border-radius:var(--radius)}
.cb h2{margin:0 0 6px;font-size:26px}
.cb p{color:var(--muted);margin:0 0 14px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:14px;margin-top:10px}
footer .soc{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}
footer .soc a{color:var(--ink);font-weight:600}
.wa{position:fixed;inset-inline-end:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#25d366;display:none;place-items:center;z-index:34;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.wa svg{width:30px;height:30px}

.ov{position:fixed;inset:0;background:rgba(20,10,22,.5);z-index:60;display:none}
.ov.show{display:block}
.sheet{position:fixed;z-index:61;background:var(--bg);display:none;overflow-y:auto}
.sheet.show{display:block}
.sheet.prod{inset-block-end:0;inset-inline:0;max-height:92vh;border-radius:26px 26px 0 0;margin:0 auto;max-width:620px;padding:0 0 calc(86px + env(safe-area-inset-bottom,0px))}
.sheet.cart{inset-block:0;inset-inline-start:0;width:420px;max-width:100%;padding:0 0 env(safe-area-inset-bottom,0px)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.sh-h b{font-size:18px}
.big{height:230px;display:grid;place-items:center;font-size:104px}
.pad{padding:16px 18px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.qty button{width:38px;height:38px;border:0;background:none;font-size:20px}
.qty span{min-width:28px;text-align:center;font-weight:700}
.sticky{position:fixed;bottom:0;inset-inline:0;max-width:620px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:3}
.ci{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.ci .th{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:28px;flex:none}
.ci .in{flex:1;min-width:0}
.sum{padding:14px 18px;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.ok{color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;width:100%}
.field.err input,.field.err select{border-color:#c23b3b}
.field .em{color:#c23b3b;font-size:12.5px;display:none}
.field.err .em{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-align:center}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.seg small{display:block;color:var(--muted);font-weight:400}
.cod{display:flex;gap:10px;align-items:center;background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.done{text-align:center;padding:50px 22px}
.done .ck{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:38px;margin:0 auto 14px}
.toast{position:fixed;left:50%;transform:translate(-50%,160%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:80;transition:transform .25s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.bar{display:none}
/* وضع التعديل داخل لوحة التحكم */
.editing [data-i18n]:hover{outline:2px dashed #2f7bff;outline-offset:2px;cursor:pointer}
.editing [data-sec]{cursor:pointer}
.editing [data-sec]:hover{outline:1px dashed rgba(47,123,255,.6);outline-offset:6px}
.editing [data-pick]:hover{outline:2px dashed #2f7bff;outline-offset:2px}
.sel{outline:2px solid #2f7bff!important;outline-offset:4px!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}html{scroll-behavior:auto}}

@media (max-width:900px){
  .pg{grid-template-columns:repeat(2,1fr);gap:10px}
  .hero{grid-template-columns:1fr;gap:16px}
  .hero h1{font-size:30px}
  .heroart,.heroimg{order:-1}
  .heroart{height:220px}.heroimg{height:220px}
  .heroart .a{width:110px;height:110px;font-size:52px}
  .heroart .b{width:76px;height:76px;font-size:36px}
  .heroart .c{width:84px;height:84px;font-size:40px}
  .trust{grid-template-columns:1fr 1fr}
  .reviews,.how,.cb.has-img{grid-template-columns:1fr}
  .btrack .pc{flex-basis:168px}
  .hnav{display:none}
  .sheet.cart{inset-inline:0;width:100%}
  .wa{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .bar{display:flex;position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--brand);color:var(--brand-ink);border:0;border-radius:16px;padding:13px 18px;justify-content:space-between;font-weight:700;box-shadow:0 10px 28px rgba(30,60,45,.35)}
  body{padding-bottom:84px}
}
</style>
</head>
<body>
<div class="ann" id="ann"></div>
<header id="hdr"><div class="wrap hd">
  <a class="logo" href="#top" data-pick="logo"><i id="logoMark">ب</i><img id="logoImg" alt="" hidden><span id="brandName"></span></a>
  <nav class="hnav"><a href="#shop" data-i18n="nav_shop"></a><a href="#how" data-i18n="nav_how"></a><a href="#reviews" data-i18n="nav_rev"></a></nav>
  <div class="sp"></div>
  <button class="lang" id="langBtn" aria-label="Langue / اللغة"></button>
  <button class="ib" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
  <button class="ib" id="cartBtn" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 7H6M9 20a1 1 0 100-2 1 1 0 000 2zM17 20a1 1 0 100-2 1 1 0 000 2z"/></svg><span class="cnt" id="cartCnt">0</span></button>
</div></header>

<main class="wrap main" id="top">
  <section class="blk" data-sec="hero">
    <div class="hero" id="heroGrid">
      <div>
        <h1 data-i18n="heroT"></h1>
        <p data-i18n="heroS"></p>
        <button class="btn" id="heroCta" data-i18n="cta"></button>
      </div>
      <div id="heroVis"></div>
    </div>
  </section>

  <section class="blk" data-sec="trust">
    <div class="trust">
      <div><em>💵</em><span><b data-i18n="t1a"></b><span data-i18n="t1b"></span></span></div>
      <div><em>🚚</em><span><b data-i18n="t2a"></b><span data-i18n="t2b"></span></span></div>
      <div><em>✅</em><span><b data-i18n="t3a"></b><span data-i18n="t3b"></span></span></div>
      <div><em>↩️</em><span><b data-i18n="t4a"></b><span data-i18n="t4b"></span></span></div>
    </div>
  </section>

  <section class="blk" id="best" data-sec="best">
    <div class="bh"><h2 class="t" data-i18n="bestT"></h2>
      <div class="arrows"><button class="ib arr prev" id="bPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><button class="ib arr next" id="bNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div></div>
    <div class="btrack" id="bTrack" tabindex="0"></div>
  </section>

  <section class="blk" id="shop" data-sec="shop">
    <h2 class="t" data-i18n="shopT"></h2>
    <div class="cats" id="cats"></div>
    <div class="skin" id="skin"></div>
    <div class="pg" id="grid"></div>
  </section>

  <section class="blk" id="how" data-sec="how">
    <div class="how">
      <div><h3 data-i18n="h1t"></h3><p data-i18n="h1p"></p></div>
      <div><h3 data-i18n="h2t"></h3><p data-i18n="h2p"></p></div>
      <div><h3 data-i18n="h3t"></h3><p data-i18n="h3p"></p></div>
    </div>
  </section>

  <section class="blk" id="reviews" data-sec="reviews">
    <h2 class="t" data-i18n="revT"></h2>
    <div class="reviews">
      <div class="rv"><span class="stars">★★★★★</span><p data-i18n="r1"></p><small data-i18n="r1n"></small></div>
      <div class="rv"><span class="stars">★★★★★</span><p data-i18n="r2"></p><small data-i18n="r2n"></small></div>
      <div class="rv"><span class="stars">★★★★☆</span><p data-i18n="r3"></p><small data-i18n="r3n"></small></div>
    </div>
  </section>
</main>
<footer><div class="wrap"><div><b id="fBrand"></b> · <span data-i18n="fContact"></span> <bdi id="fPhone" dir="ltr"></bdi></div><div class="soc" id="soc"></div><div data-i18n="fReturn"></div></div></footer>

<a class="wa" id="wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg></a>
<button class="bar" id="bar"><span id="barTxt"></span><span id="barTot"></span></button>
<div class="ov" id="ov"></div>
<div class="sheet prod" id="pSheet" role="dialog" aria-modal="true"></div>
<div class="sheet cart" id="cSheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

let bIdx=0,bTimer=null,bPaused=false,bVisible=true,bSync=null;
function renderBest(){
  const tr=$('#bTrack');
  const list=P.filter(p=>p.stock>0).sort((a,b)=>b.sold-a.sold).slice(0,CONFIG.best.count);
  tr.innerHTML=list.map((p,i)=>card(p,{tag:`<span class="tag best-tag">${T('bestTag')}</span>`,rank:`<span class="rank">${i+1}</span>`,sold:`<span class="sold">${T('sold',p.sold)}</span>`})).join('');
  tr.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openP(+b.dataset.p));
  bIdx=0;tr.scrollLeft=0;bestStart();
}
function bGo(i){
  const items=$('#bTrack').children,n=items.length;if(!n)return;
  bIdx=(i+n)%n;
  if(items[bIdx].scrollIntoView)items[bIdx].scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});
}
function bestStart(){
  clearInterval(bTimer);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!CONFIG.best.auto||reduce)return;
  bTimer=setInterval(()=>{if(bPaused||!bVisible||document.hidden||editing)return;bGo(bIdx+1)},CONFIG.best.interval);
}
function syncIdx(){
  const tr=$('#bTrack'),r=tr.getBoundingClientRect(),rtl=document.documentElement.dir==='rtl';
  let best=0,d=1e9;[...tr.children].forEach((c,i)=>{const b=c.getBoundingClientRect();const x=Math.abs(rtl?b.right-r.right:b.left-r.left);if(x<d){d=x;best=i}});bIdx=best;
}
(function bestInit(){
  const tr=$('#bTrack');
  tr.addEventListener('scroll',()=>{clearTimeout(bSync);bSync=setTimeout(syncIdx,140)},{passive:true});
  tr.addEventListener('pointerenter',()=>{bPaused=true});tr.addEventListener('pointerleave',()=>{bPaused=false});
  tr.addEventListener('focusin',()=>{bPaused=true});tr.addEventListener('focusout',()=>{bPaused=false});
  tr.addEventListener('touchstart',()=>{bPaused=true;clearTimeout(bSync);setTimeout(()=>{bPaused=false},6000)},{passive:true});
  $('#bPrev').onclick=()=>bGo(bIdx-1);$('#bNext').onclick=()=>bGo(bIdx+1);
  if('IntersectionObserver' in window){bVisible=false;new IntersectionObserver(es=>{bVisible=es[0].isIntersecting},{threshold:.25}).observe($('#best'))}
})();

   <div class="field" id="f-com"><label>${D('fCom')}</label><input id="in-com" value="${esc(f.com)}"><span class="em">${D('eCom')}</span></div></div>
   <div class="field" id="f-addr"><label>${D('fAddr')}</label><input id="in-addr" value="${esc(f.addr)}"><span class="em">${D('eAddr')}</span></div>
   <div class="seg"><button data-mode="0" aria-pressed="${f.mode===0}">${D('home')}<small>${rt?fmt(rt[0]):T('pickWil')}</small></button><button data-mode="1" aria-pressed="${f.mode===1}">${D('relay')}<small>${rt?fmt(rt[1]):T('cheaper')}</small></button></div>
   <div class="cod"><span style="font-size:22px">💵</span><span><b>${D('codT')}</b><br>${D('codD')}</span></div></div>
   <div class="sum"><div>${D('sProd')}<span>${fmt(sub())}</span></div><div>${D('sShip')}<span>${s===null?T('shipWait'):s===0?`<b class="ok">${T('free')}</b>`:fmt(s)}</span></div><div class="tot">${D('sTot')}<span>${fmt(tot)}</span></div></div>
   <div class="pad"><button class="btn block" id="confirm">${T('confirm')} · ${fmt(tot)}</button><p style="font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 0" data-i18n="callNote">${T('callNote')}</p></div>`;
  $('#x2').onclick=closeAll;
  const keep=()=>{f.name=$('#in-name').value;f.phone=$('#in-phone').value;f.com=$('#in-com').value;f.addr=$('#in-addr').value;f.wil=$('#in-wil').value};
  $('#in-wil').onchange=()=>{keep();drawCart()};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{keep();f.mode=+b.dataset.mode;drawCart()});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{keep();const i=cart[+b.dataset.m];i.q--;if(i.q<=0)cart.splice(+b.dataset.m,1);upd();drawCart()});
  document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{keep();const i=cart[+b.dataset.pl];i.q=Math.min(P.find(p=>p.id===i.id).stock,i.q+1);upd();drawCart()});
  $('#confirm').onclick=()=>{keep();submit()};
}
function submit(){
  const ph=f.phone.replace(/[\s.\-]/g,'');
  const chk={name:f.name.trim().length>=3,phone:/^0[567]\d{8}$/.test(ph),wil:f.wil!=='',com:f.com.trim().length>1,addr:f.addr.trim().length>3};
  let bad=false;
  Object.entries(chk).forEach(([k,ok])=>{$('#f-'+k).classList.toggle('err',!ok);if(!ok)bad=true});
  if(bad){const first=document.querySelector('.field.err');first.scrollIntoView({block:'center'});first.querySelector('input,select').focus();return}
  const s=ship(),tot=sub()+s,id=2000+Math.floor(Math.random()*900);
  $('#cSheet').innerHTML=head(D('doneT'))+`<div class="done"><div class="ck">✓</div><h2 style="margin:0 0 6px">${T('thanks',esc(f.name.trim().split(' ')[0]))}</h2><p style="color:var(--muted);margin:0 0 16px">${D('orderNo')} <b dir="ltr">${ltr('#'+id)}</b>. ${T('callYou',`<b dir="ltr">${ltr(ph)}</b>`)}</p>
   <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start"><div class="sum" style="padding:0"><div>${D('deliverTo')}<span>${WIL[L][+f.wil]} · ${f.mode?T('relay'):T('home')}</span></div><div class="tot">${D('dueCod')}<span>${fmt(tot)}</span></div></div></div>
   <button class="btn block" id="ok" style="margin-top:16px">${T('cont')}</button></div>`;
  $('#x2').onclick=closeAll;$('#ok').onclick=closeAll;
  cart=[];demo=false;upd();
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
$('#themeBtn').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#17111a';d.setAttribute('data-theme',dark?'light':'dark')};

/* ===== ربط محرر «تصميم المتجر» (المعاينة داخل لوحة التحكم) ===== */
function view(w){
  closeAll();
  if(demo){cart=[];demo=false;upd()}
  if(w==='page'||!w)return;
  if(w==='product'){openP(P[0].id);return}
  demo=true;
  if(!cart.length){cart.push({k:'1-0',id:1,vi:0,q:1},{k:'3-0',id:3,vi:0,q:1});upd()}
  if(w==='cart'){drawCart();show($('#cSheet'))}
  if(w==='success'){f={name:'أمينة بن علي',phone:'0550123456',wil:'18',com:'سطيف',addr:'حي 5 جويلية',mode:0};drawCart();show($('#cSheet'));submit()}
}
function mark(kind,key){
  document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  const el=kind==='text'?document.querySelector(`[data-i18n="${key}"]`):kind==='logo'?document.querySelector('[data-pick="logo"]'):document.querySelector(`[data-sec="${key}"]`);
  if(el){el.classList.add('sel');if(el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'})}
}
function pick(kind,key,el){
  document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));if(el)el.classList.add('sel');
  window.parent.postMessage({t:'pick',kind,key},'*');
}
if(EMB){
  window.addEventListener('message',e=>{
    if(e.source!==window.parent)return;
    const m=e.data||{};
    if(m.t==='cfg')setConfig(m.cfg);
    else if(m.t==='lang'){if(CONFIG.langs[m.lang]&&m.lang!==L){L=m.lang;applyLang()}}
    else if(m.t==='edit'){editing=!!m.on;document.documentElement.classList.toggle('editing',editing)}
    else if(m.t==='view')view(m.what);
    else if(m.t==='sel')mark(m.kind,m.key);
  });
  document.addEventListener('click',e=>{
    if(!editing)return;
    if(e.target.closest('#langBtn,#themeBtn,#cartBtn,.ov'))return;
    let el=e.target.closest('[data-i18n]');
    if(el){e.preventDefault();e.stopPropagation();pick('text',el.dataset.i18n,el);return}
    el=e.target.closest('[data-pick]');
    if(el){e.preventDefault();e.stopPropagation();pick('logo','logo',el);return}
    el=e.target.closest('[data-sec]');
    if(el){e.preventDefault();e.stopPropagation();pick('sec',el.dataset.sec,el)}
  },true);
}

/* اللغة: اختيار الزائرة المحفوظ، وإلا اللغة الافتراضية من إعدادات التصميم */
(function init(){
  let s=null;if(!EMB){try{s=localStorage.getItem('lang')}catch(e){}}
  L=(s&&CONFIG.langs[s])?s:CONFIG.defLang;
  if(!CONFIG.langs[L])L=CONFIG.langs.ar?'ar':'fr';
  applyConfig();applyLang();
  if(EMB)window.parent.postMessage({t:'ready'},'*');
})();
</script>
</body>
</html>
