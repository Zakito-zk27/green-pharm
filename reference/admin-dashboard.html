<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة تحكم المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2f5d46;          /* اللون الرئيسي للبراند */
  --brand-ink:#ffffff;
  --accent:#4f9c88;         /* لون ثانوي (نجاح / متوفر) */
  --side:#1d2b24;           /* لون القائمة الجانبية */
  --side-ink:#e9dfe9;
  --radius:12px;
  --bg:#f6f3f6; --card:#ffffff; --ink:#241b27; --muted:#7a6e7e; --line:#e8e1e9;
  --warn:#c9822b; --bad:#c23b3b; --info:#3d6fb5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17111a;--card:#221a26;--ink:#f1eaf2;--muted:#a698aa;--line:#33283a;}
}
:root[data-theme="dark"]{--bg:#17111a;--card:#221a26;--ink:#f1eaf2;--muted:#a698aa;--line:#33283a;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 24px;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.logo-mark{width:40px;height:40px;border-radius:calc(var(--radius) - 2px);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.logo b{display:block;font-size:16px;line-height:1.2}
.logo small{opacity:.6;font-size:12px}
.grp{font-size:12px;opacity:.55;padding:16px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;text-align:right;padding:9px 10px;border-radius:10px;font-weight:500}
.nav:hover{background:rgba(255,255,255,.07)}
.nav[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;min-width:18px;text-align:center}
.scrim{display:none}

/* Main */
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;inset-inline-start:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;line-height:18px;text-align:center;padding:0 4px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;height:40px;color:var(--muted)}
.search input{border:0;background:none;flex:1;outline:none;min-width:0}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;direction:ltr}
.spacer{flex:1}
.burger{display:none}
.content{padding:22px 20px 60px;max-width:1280px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:500}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:14px}
.kpi small{color:var(--muted)}
.kpi b{display:block;font-size:26px;line-height:1.3}
.kpi .d{font-size:13px}
.up{color:var(--accent)} .down{color:var(--bad)}
.two{grid-template-columns:2fr 1fr;margin-bottom:14px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{font-weight:600;color:var(--muted);font-size:13px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;font-weight:600}
.s-new{background:#e6eefb;color:var(--info)} .s-conf{background:#e5f3ef;color:#2f7a68}
.s-ship{background:#fbefdc;color:#9a6217} .s-done{background:#e0f1e6;color:#2a7a45}
.s-ret{background:#fbe5e5;color:var(--bad)} .s-can{background:#eee;color:#666}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));margin-bottom:8px;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:38px;background:var(--brand);border-radius:8px 8px 4px 4px;opacity:.85}
.bar.today i{opacity:1;background:var(--brand)}
.bar span{font-size:12px;color:var(--muted)}
.bar em{font-style:normal;font-size:11px;color:var(--muted)}
.prod-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.thumb{height:120px;border-radius:10px;margin-bottom:10px;display:grid;place-items:center;font-size:34px}
.stock{font-size:13px}
.inv td.q{text-align:center;font-weight:600}
.q.ok{color:var(--accent)} .q.low{color:var(--warn)} .q.out{color:var(--bad)}
input.num{width:84px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px}
.switch{width:42px;height:24px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:21px}
.offers{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.offer h3{margin:0 0 4px;font-size:16px}
.offer .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:1px 8px;direction:ltr;display:inline-block;font-size:13px}
/* landing builder */
.lp{grid-template-columns:260px 1fr 1fr;align-items:start}
.blk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--card)}
.blk span{flex:1}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:7px;width:28px;height:28px;display:grid;place-items:center;font-size:13px}
.phone{width:290px;max-width:100%;margin:0 auto;border:8px solid var(--ink);border-radius:30px;background:#fff;color:#241b27;height:560px;overflow-y:auto}
.phone .sec{padding:14px 14px;border-bottom:1px solid #f0e9f1;font-size:13.5px}
.phone .hero{background:linear-gradient(160deg,color-mix(in srgb,var(--brand) 85%,#fff),color-mix(in srgb,var(--brand) 45%,#fff));color:#fff;text-align:center;padding:26px 14px}
.phone .hero b{font-size:19px;display:block}
.phone input{width:100%;border:1px solid #e0d6e2;border-radius:8px;padding:7px 9px;margin-bottom:6px;background:#fff;color:#241b27}
.phone .go{width:100%;border:0;border-radius:9px;background:var(--brand);color:var(--brand-ink);padding:9px;font-weight:700}
.cd{display:flex;gap:6px;justify-content:center;direction:ltr}
.cd div{background:#1d2b24;color:#fff;border-radius:8px;padding:6px 10px;text-align:center;min-width:46px}
/* brand */
.brandgrid{grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
.field input[type=text],.field select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.field input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--card)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.toast{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:60;transform:translateY(140%);transition:transform .25s}
.toast.show{transform:none}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
@media (prefers-reduced-motion:reduce){.toast,.switch::after{transition:none}}

/* store designer */
.ds{display:grid;grid-template-columns:400px 1fr;gap:14px;align-items:start}
.dscol{display:grid;gap:12px;min-width:0}
.dspanel{display:grid;gap:12px}
.tabs{position:sticky;top:62px;z-index:5;background:var(--bg);padding:6px 0}
.small{font-size:13px;margin:8px 0 0}
.muted{color:var(--muted)}
.pv-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fw{display:flex;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--bg) 10px,var(--bg) 20px)}
#sfFrame{border:0;background:#fff;flex:none;display:block}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.segc{display:flex;gap:6px;flex-wrap:wrap}
.cfg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;direction:ltr;text-align:left;max-height:260px;overflow:auto;white-space:pre-wrap;margin:8px 0 0}
.srow{cursor:pointer}
.srow.on{border-color:var(--brand)}
.thumb{width:100%;max-height:120px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:6px}
.trow{padding:10px 0;border-top:1px solid var(--line)}
.trow .tl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.trow input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;margin-bottom:4px}
.field input[type=file]{padding:6px}
.tg summary{cursor:pointer;font-weight:600}
@media (max-width:1000px){.ds{grid-template-columns:1fr}.tabs{position:static}}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two,.lp,.brandgrid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:272px;max-width:86vw;transform:translateX(100%);transition:transform .22s;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .burger{display:grid}
  .search .kbd{display:none}
  .content{padding:16px 14px 70px}
  h1{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="القائمة الرئيسية">
    <div class="logo">
      <div class="logo-mark" id="logoMark">G</div>
      <div><b id="logoName">Green Pharm</b><small>لوحة التحكم · v1.0</small></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="icon-btn burger" id="burger" aria-label="فتح القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="ابحث عن طلب، منتج أو رقم هاتف" aria-label="بحث"><span class="kbd">Ctrl+K</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
      <button class="icon-btn" id="bell" aria-label="الإشعارات"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1112 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 004 0"/></svg><span class="badge" id="bellCnt">3</span></button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span></div>

<script>
const ICON = {
  home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
  cart:'<path d="M3 4h2l2.5 11h10L20 7H6M9 20a1 1 0 100-2 1 1 0 000 2zM17 20a1 1 0 100-2 1 1 0 000 2z"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',
  page:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8zM7.5 8.5h.01"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6M16 5a3.5 3.5 0 010 7M18 14c2 .6 3.2 2.4 3.5 6"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  truck:'<path d="M2 6h12v10H2zM14 9h4l3 3v4h-7M6 19a2 2 0 100-4 2 2 0 000 4zM17 19a2 2 0 100-4 2 2 0 000 4z"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  brush:'<path d="M18 3l3 3-9 9-3-3zM9 12c-3 0-4 2-4 4s-1 3-2 4c3 1 8 0 8-4"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
const NAV = [
  ['البيع',[['home','الرئيسية','home'],['cart','الطلبات','orders',3],['box','المنتجات','products']]],
  ['التسويق',[['page','صفحات الهبوط','landing'],['tag','العروض والتخفيضات','offers'],['chart','الإحصائيات','home']]],
  ['الزبائن',[['users','العملاء','soon'],['ban','القائمة السوداء','soon']]],
  ['التوصيل',[['truck','أسعار التوصيل','delivery'],['truck','شركات التوصيل','soon']]],
  ['المخزون',[['grid','المخزون','inventory'],['list','حركات المخزون','soon'],['clock','المخزون الراكد','soon']]],
  ['المتجر',[['brush','تصميم المتجر','design'],['gear','مظهر اللوحة','brand'],['gear','الإعدادات','soon']]]
];
const STATUS = {new:['جديد','s-new'],conf:['مؤكد','s-conf'],ship:['قيد الشحن','s-ship'],done:['مُسلَّم','s-done'],ret:['مرتجع','s-ret'],can:['ملغى','s-can']};
let orders = [
  {id:1048,name:'أمينة ب.',phone:'0550 12 34 56',wil:'الجزائر',total:5400,st:'new',t:'قبل 4 د',item:'سيروم فيتامين C × 2'},
  {id:1047,name:'سارة م.',phone:'0661 44 20 18',wil:'وهران',total:3200,st:'new',t:'قبل 22 د',item:'كريم مرطب SPF50'},
  {id:1046,name:'ياسمين ح.',phone:'0770 98 12 07',wil:'قسنطينة',total:7900,st:'new',t:'قبل ساعة',item:'روتين العناية الكامل'},
  {id:1045,name:'نور الهدى ك.',phone:'0555 61 03 77',wil:'سطيف',total:2800,st:'conf',t:'قبل 3 س',item:'غسول لطيف × 1'},
  {id:1044,name:'ليلى ع.',phone:'0662 20 45 90',wil:'عنابة',total:4600,st:'ship',t:'أمس',item:'تونر الورد × 2'},
  {id:1043,name:'ريم ز.',phone:'0771 33 08 52',wil:'باتنة',total:3900,st:'done',t:'أمس',item:'ماسك الطين'},
  {id:1042,name:'هدى ش.',phone:'0556 70 19 64',wil:'بجاية',total:2500,st:'ret',t:'قبل يومين',item:'مقشر AHA'},
];
const products = [
  {n:'سيروم فيتامين C',p:2700,q:34,e:'🍊',c:'#fde7d2'},
  {n:'كريم مرطب SPF50',p:3200,q:6,e:'☀️',c:'#fff3c9'},
  {n:'غسول لطيف',p:2800,q:58,e:'🫧',c:'#dff0f5'},
  {n:'تونر الورد',p:2300,q:3,e:'🌹',c:'#fbdde6'},
  {n:'ماسك الطين',p:3900,q:21,e:'🌿',c:'#e0efdc'},
  {n:'مقشر AHA',p:2500,q:0,e:'✨',c:'#ece3f7'},
];
const invVar = [
  ['سيروم فيتامين C',[['30 مل',20],['50 مل',14]]],
  ['كريم مرطب SPF50',[['50 مل',6]]],
  ['غسول لطيف',[['150 مل',40],['250 مل',18]]],
  ['تونر الورد',[['100 مل',3],['200 مل',0]]],
  ['ماسك الطين',[['75 مل',21]]],
  ['مقشر AHA',[['30 مل',0]]],
];
const wilayas = [['أدرار',900,600],['الشلف',700,450],['الأغواط',850,550],['بجاية',650,400],['باتنة',700,450],['الجزائر',500,300],['وهران',600,400],['قسنطينة',650,400],['سطيف',650,400],['عنابة',700,450],['تمنراست',1500,1000],['غرداية',900,600]];
let offers = [
  {n:'خصم أول طلب',d:'15% على الطلب الأول',code:'WELCOME15',on:true},
  {n:'اشترِ 2 والثالث مجاناً',d:'على منتجات العناية بالبشرة',code:'',on:true},
  {n:'شحن مجاني',d:'للطلبات فوق 6000 دج',code:'FREESHIP',on:false},
  {n:'عرض نهاية الأسبوع',d:'-10% حتى الجمعة',code:'WEEKEND10',on:false},
];
let blocks = ['hero','features','reviews','countdown','form'];
const BLK = {hero:'العنوان والصورة',features:'المزايا',reviews:'التقييمات',countdown:'عدّاد تنازلي',form:'نموذج الطلب'};
let filter='all', page='home';
const $ = s=>document.querySelector(s);
const fmt = n=>n.toLocaleString('en-US').replace(/,/g,' ')+' دج';

/* nav */
function drawNav(){
  $('#nav').innerHTML = NAV.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([ic,t,p,c])=>{
    const cnt = p==='orders' ? orders.filter(o=>o.st==='new').length : c;
    return `<button class="nav" data-p="${p}" ${p===page?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICON[ic]}</svg><span>${t}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</button>`;
  }).join('')).join('');
  document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.p));
  const n = orders.filter(o=>o.st==='new').length;
  $('#bellCnt').textContent = n; $('#bellCnt').style.display = n?'':'none';
}
function go(p){ page=p; closeSide(); drawNav(); render(); window.scrollTo(0,0); }

/* pages */
const pill = s=>`<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
function ordersTable(list, actions){
  if(!list.length) return `<div class="empty">لا توجد طلبات بهذه الحالة.</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>الطلب</th><th>العميل</th><th>الولاية</th><th>المنتج</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead><tbody>`+
  list.map(o=>`<tr><td>#${o.id}<br><small style="color:var(--muted)">${o.t}</small></td><td>${o.name}<br><small style="color:var(--muted);direction:ltr;display:inline-block">${o.phone}</small></td><td>${o.wil}</td><td>${o.item}</td><td>${fmt(o.total)}</td><td>${pill(o.st)}</td><td>${actions?actionFor(o):''}</td></tr>`).join('')+`</tbody></table></div>`;
}
function actionFor(o){
  const next = {new:['conf','تأكيد الطلب'],conf:['ship','شحن'],ship:['done','تم التسليم']}[o.st];
  return next?`<button class="btn sm ${o.st==='new'?'pri':''}" data-id="${o.id}" data-next="${next[0]}">${next[1]}</button>`:'';
}
function bindActions(){
  document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{
    const o=orders.find(x=>x.id==b.dataset.id); o.st=b.dataset.next;
    toast(`تم تحديث الطلب #${o.id}: ${STATUS[o.st][0]}`); drawNav(); render();
  });
}

const getVar = v=>{const x=getComputedStyle(document.documentElement).getPropertyValue(v).trim();return x.length===7?x:'#b8325a'};
/* ===== أرقام صحيحة في العربية: عزل كل رقم من اتجاه RTL (2 700 كانت تظهر 700 2) ===== */
const LRI='\u2066',PDI='\u2069';
const fixNums=s=>String(s).replace(/([#+\-]?\d[\d\u00A0 .,:\/\-]*\d%?|[#+\-]?\d%?)/g,m=>LRI+m+PDI);
function fixDom(root){
  if(!root)return;
  const bad={SCRIPT:1,STYLE:1,PRE:1,TEXTAREA:1,IFRAME:1};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentNode&&bad[n.parentNode.nodeName])?NodeFilter.FILTER_REJECT:(/\d/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP)});
  const arr=[];while(w.nextNode())arr.push(w.currentNode);
  arr.forEach(n=>{if(!n.nodeValue.includes(LRI))n.nodeValue=fixNums(n.nodeValue)});
}

/* --- التواصل مع المعاينة (iframe) --- */
function send(m){const f=$('#sfFrame');if(f&&f.contentWindow)f.contentWindow.postMessage(m,'*')}
const cfgText=()=>JSON.stringify(DS,(k,v)=>typeof v==='string'&&v.startsWith('data:image')?'[صورة]':v,2);
let pend=false;
function push(){
  if(pend)return;pend=true;
  (window.requestAnimationFrame||setTimeout)(()=>{pend=false;send({t:'cfg',cfg:DS});const j=$('#cfgJson');if(j)j.textContent=cfgText()});
}
window.addEventListener('message',e=>{
  const f=$('#sfFrame');if(!f||e.source!==f.contentWindow)return;
  const m=e.data||{};
  if(m.t==='ready'){send({t:'cfg',cfg:DS});send({t:'lang',lang:pLang});send({t:'edit',on:editOn});if(pView!=='page')send({t:'view',what:pView})}
  else if(m.t==='pick')onPick(m);
  else if(m.t==='lang'){pLang=m.lang;drawBar()}
});
function onPick(m){
  if(m.kind==='text'){
    dTab='texts';drawTabs();drawPanel();
    const el=$('#tx-'+m.key+'-'+pLang)||$('#tx-'+m.key+'-ar');
    if(el){const d=el.closest('details');if(d)d.open=true;if(el.scrollIntoView)el.scrollIntoView({block:'center'});el.focus()}
  }else if(m.kind==='sec'){dTab='sections';selSec=m.key;drawTabs();drawPanel()}
  else{dTab='general';drawTabs();drawPanel();const el=$('#dsName');if(el){if(el.scrollIntoView)el.scrollIntoView({block:'center'});el.focus()}}
}
function resizeImg(file,max,mime){
  return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(mime,.82))};im.src=r.result};r.readAsDataURL(file)});
}
function fit(){
  const w=$('#fw'),f=$('#sfFrame');if(!w||!f)return;
  const W=pDev==='mobile'?390:1200,H=780,k=Math.min(1,(w.clientWidth||W)/W);
  f.style.width=W+'px';f.style.height=H+'px';f.style.transform=`scale(${k})`;f.style.transformOrigin='top center';w.style.height=(H*k)+'px';
}

function drawBar(){
  const pr=(sel,attr,val)=>document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[attr]===val)));

}

function textsPanel(){
  const used=new Set(TXG.flatMap(g=>g[1])),left=Object.keys(TXD.ar).filter(k=>!used.has(k));
  const groups=TXG.map(g=>[g[0],g[1].filter(k=>k in TXD.ar)]).concat([['أخرى',left]]);
  const row=k=>{const o=DS.texts[k]||{};const hint=/\{0\}/.test(TXD.ar[k])?' <small class="muted">({0} = قيمة تلقائية)</small>':'';
    return `<div class="trow" data-k="${k}" data-s="${esc((k+' '+TXD.ar[k]+' '+TXD.fr[k]).toLowerCase())}"><div class="tl">${esc(TXD.ar[k].slice(0,44))}${hint}</div><input type="text" id="tx-${k}-ar" data-tx="${k}|ar" value="${esc(o.ar||'')}" placeholder="${esc(TXD.ar[k])}"><input type="text" id="tx-${k}-fr" dir="ltr" data-tx="${k}|fr" value="${esc(o.fr||'')}" placeholder="${esc(TXD.fr[k])}"></div>`};
  return dcard('كل نصوص المتجر','<div class="field" style="margin:0"><label>بحث</label><input type="text" id="txSearch" placeholder="مثال: الدفع، السلة، Livraison"></div><p class="sub small">اترك الحقل فارغاً لاستخدام النص الافتراضي (يظهر باهتاً). الحقل الأول بالعربية والثاني بالفرنسية.</p>')+
    groups.map(([t,keys])=>`<details class="card tg"><summary>${t} <small class="muted">(${keys.length})</small></summary>${keys.map(row).join('')}</details>`).join('');
}

function syncLang(){
  if(!DS.langs[DS.defLang])DS.defLang=DS.langs.ar?'ar':'fr';
  if(!DS.langs[pLang]){pLang=DS.langs.ar?'ar':'fr';send({t:'lang',lang:pLang})}

function setText(k,l,v){const o=DS.texts[k]||(DS.texts[k]={ar:'',fr:''});o[l]=v;if(!o.ar&&!o.fr)delete DS.texts[k];push()}
function bindPanel(){
  const pn=$('#dsPanel');
  pn.querySelectorAll('[data-p]').forEach(el=>{const h=()=>{let v=el.value;if(el.dataset.num)v=+v;setPath(DS,el.dataset.p,v);push()};el.addEventListener('input',h);el.addEventListener('change',h)});
  pn.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{
    const p=b.dataset.sw,v=b.getAttribute('aria-checked')!=='true';
    if(p==='langs.ar'||p==='langs.fr'){const o=p==='langs.ar'?'fr':'ar';if(!v&&!DS.langs[o]){toast('يجب إبقاء لغة واحدة على الأقل');return}}
    setPath(DS,p,v);b.setAttribute('aria-checked',String(v));
    if(p.startsWith('langs.'))syncLang();else push();
  });
  pn.querySelectorAll('[data-img]').forEach(inp=>inp.onchange=async()=>{
    const file=inp.files[0];if(!file)return;
    try{const logo=inp.dataset.img==='logo';setPath(DS,inp.dataset.img,await resizeImg(file,logo?320:1100,logo?'image/png':'image/jpeg'));push();drawPanel()}catch(e){toast('تعذّر قراءة الصورة')}
  });
  pn.querySelectorAll('[data-imgdel]').forEach(b=>b.onclick=()=>{setPath(DS,b.dataset.imgdel,'');push();drawPanel()});
  pn.querySelectorAll('[data-swatch]').forEach(b=>b.onclick=()=>{DS.color=b.dataset.swatch;const c=pn.querySelector('[data-p="color"]');if(c)c.value=DS.color;push()});
  const cp=$('#dsCopy');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(DS,null,2));toast('تم نسخ الإعداد')}catch(e){toast('حدّد النص أدناه وانسخه يدوياً')}};
  /* الأقسام */
  const re=()=>{drawPanel();push()};
  const mv=(i,d)=>{const j=i+d;if(j<0||j>=DS.sections.length)return;[DS.sections[i],DS.sections[j]]=[DS.sections[j],DS.sections[i]];re()};
  pn.querySelectorAll('[data-selsec]').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;selSec=r.dataset.selsec;send({t:'sel',kind:'sec',key:selSec});drawPanel()});
  pn.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,-1));
  pn.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,1));
  pn.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const s=DS.sections[+b.dataset.sv];s.on=!s.on;b.setAttribute('aria-checked',String(s.on));push()});
  pn.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=DS.sections[+b.dataset.del];DS.custom=DS.custom.filter(c=>'c:'+c.id!==s.k);DS.sections.splice(+b.dataset.del,1);if(selSec===s.k)selSec='hero';re()});
  const ab=$('#addBanner');if(ab)ab.onclick=()=>{
    const id='b'+Date.now().toString(36);
    DS.custom.push({id,image:'',link:'#shop',title:{ar:'عرض خاص هذا الأسبوع',fr:'Offre spéciale de la semaine'},text:{ar:'خصم على منتجات مختارة لفترة محدودة.',fr:'Remise sur une sélection de produits, durée limitée.'},btn:{ar:'استفيدي من العرض',fr:'Profiter de l’offre'}});
    DS.sections.splice(1,0,{k:'c:'+id,on:true,bg:'brand',pad:'md',align:'center'});selSec='c:'+id;re();send({t:'sel',kind:'sec',key:'c:'+id});
  };
  /* النصوص */
  pn.querySelectorAll('[data-tx]').forEach(el=>el.addEventListener('input',()=>{const [k,l]=el.dataset.tx.split('|');setText(k,l,el.value)}));
  const sr=$('#txSearch');if(sr)sr.oninput=()=>{
    const q=sr.value.trim().toLowerCase();
    pn.querySelectorAll('details.tg').forEach(d=>{let any=false;d.querySelectorAll('.trow').forEach(r=>{const ok=!q||r.dataset.s.includes(q);r.style.display=ok?'':'none';if(ok)any=true});d.style.display=any?'':'none';if(q&&any)d.open=true});
  };
}

  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=offers[b.dataset.o];o.on=!o.on;toast(o.on?`تم تفعيل «${o.n}»`:`تم إيقاف «${o.n}»`);render()});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const i=+b.dataset.mv,j=i+ +b.dataset.d;if(j<0||j>=blocks.length)return;[blocks[i],blocks[j]]=[blocks[j],blocks[i]];render()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{blocks.splice(+b.dataset.rm,1);render()});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{blocks.push(b.dataset.add);render()});
  if(page==='design') bindDesign();
  const ap=$('#addProd'); if(ap) ap.onclick=()=>toast('سيُفتح نموذج إضافة منتج بالصور والأحجام');
  if(page==='brand'){
    const R=document.documentElement.style;
    $('#bName').oninput=e=>{$('#logoName').textContent=e.target.value||'اسم البراند';$('#logoMark').textContent=(e.target.value||'ب').trim().charAt(0)};
    $('#bBrand').oninput=e=>R.setProperty('--brand',e.target.value);
    $('#bSide').oninput=e=>R.setProperty('--side',e.target.value);
    $('#bAcc').oninput=e=>R.setProperty('--accent',e.target.value);
    $('#bRad').onchange=e=>R.setProperty('--radius',e.target.value+'px');
    document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{R.setProperty('--brand',b.dataset.sw);$('#bBrand').value=b.dataset.sw});
  }
}

/* toast + notifications */
let tt;
function toast(m){$('#toastTxt').textContent=fixNums(m);$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
$('#bell').onclick=()=>{
  const names=['فريال د.','كنزة ل.','إيمان ر.'],w=['تيزي وزو','مستغانم','البليدة'],i=Math.floor(Math.random()*3);
  const id=orders[0].id+1;
  orders.unshift({id,name:names[i],phone:'0555 00 11 22',wil:w[i],total:3000+i*700,st:'new',t:'الآن',item:'تونر الورد × 1'});
  drawNav(); render(); toast(`🔔 طلب جديد #${id} من ${w[i]}`);
};

/* side + theme */
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('show')}
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('show')};
$('#scrim').onclick=closeSide;
$('#themeBtn').onclick=()=>{
  const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#17111a';
  d.setAttribute('data-theme',dark?'light':'dark');
};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('.search input').focus()}});

drawNav(); render();
</script>
</body>
</html>
